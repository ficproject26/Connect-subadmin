<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forge India Connect | Admin Management System</title>
    <meta name="description" content="Hierarchical Admin Management System with Role-Based and Location-Based Access Control for State, District, Divisional, and Pincode Admins." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      (function () {
        function extractString(val) {
          if (val === null || val === undefined) return '';
          if (typeof val === 'string') return val;
          if (typeof val === 'number' || typeof val === 'boolean') return String(val);
          let res = '';
          try {
            if (val.name) res += ' ' + val.name;
            if (val.message) res += ' ' + val.message;
            if (val.stack) res += ' ' + val.stack;
            if (val.sourceFile) res += ' ' + val.sourceFile;
            if (val.blockedURI) res += ' ' + val.blockedURI;
            if (val.violatedDirective) res += ' ' + val.violatedDirective;
            if (val.sample) res += ' ' + val.sample;
            if (val.reason) res += ' ' + extractString(val.reason);
            if (val.error) res += ' ' + extractString(val.error);
            res += ' ' + String(val);
            try {
              res += ' ' + JSON.stringify(val);
            } catch (_) {}
          } catch (_) {
            res += ' ' + String(val);
          }
          return res;
        }

        const isIgnorableNoise = (msg) => {
          if (!msg) return false;
          const str = extractString(msg).toLowerCase();
          return (
            str.includes('a listener indicated an asynchronous response') ||
            str.includes('message channel closed') ||
            str.includes('runtime.lasterror') ||
            str.includes('evaluating a string as javascript violates') ||
            str.includes('content security policy') ||
            str.includes('unsafe-eval') ||
            str.includes('content.js') ||
            str.includes('chrome-extension')
          );
        };

        const filterMethod = (origFn) => {
          return function (...args) {
            for (let i = 0; i < args.length; i++) {
              if (isIgnorableNoise(args[i])) return;
            }
            const combined = args.map(extractString).join(' ');
            if (isIgnorableNoise(combined)) return;
            origFn.apply(console, args);
          };
        };

        console.error = filterMethod(console.error);
        console.warn = filterMethod(console.warn);
        console.info = filterMethod(console.info);
        console.debug = filterMethod(console.debug);

        window.addEventListener('unhandledrejection', function (e) {
          if (isIgnorableNoise(e) || isIgnorableNoise(e?.reason)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (isIgnorableNoise(e) || isIgnorableNoise(e?.error) || isIgnorableNoise(e?.message)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        const handleCSP = function (e) {
          if (isIgnorableNoise(e) || isIgnorableNoise(e?.blockedURI) || isIgnorableNoise(e?.sourceFile) || isIgnorableNoise(e?.violatedDirective)) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopPropagation === 'function') e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        };
        window.addEventListener('securitypolicyviolation', handleCSP, true);
        document.addEventListener('securitypolicyviolation', handleCSP, true);

        try {
          if (typeof window !== 'undefined' && window.chrome && window.chrome.runtime) {
            const drainLastError = () => {
              try {
                if (window.chrome.runtime.lastError) {}
              } catch (_) {}
            };
            drainLastError();
            setInterval(drainLastError, 250);
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ams_theme') || 'light';
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
